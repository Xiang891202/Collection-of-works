name: Keep Backend Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # 每 10 分鐘執行一次
  workflow_dispatch:         # 允許手動觸發

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          curl -f https://collection-of-works-backend.onrender.com/api/health || exit 1